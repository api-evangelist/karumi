name: Karumi
description: Karumi is an agentic demo platform that delivers personalized, AI-powered
  product demonstrations during live video calls. Its AI agent runs live, interactive
  demos 24/7 across landing pages, in-app surfaces, and outbound email, adapting each
  demonstration to the prospect and navigating the product in-browser in real time.
  It supports multiple languages, logs transcripts, analysis, and next steps into the
  CRM, and targets B2B SaaS go-to-market teams looking to engage high-intent leads at
  peak interest instead of waiting days for a human demo. Karumi is a Y Combinator
  (Fall 2025) company founded by Pablo Omenaca (CEO) and Toni Lopez (CTO), both
  formerly of StackAI (YC W23).
