  date: '2026-08-13'
  status: enriched
  artifacts_added: 25
  pass: local-v1
  note: >-
    Contract discovery beat the docs host. karumi.ai serves no /docs, /developers or
    /api page and no llms.txt, but the API host root has a live OpenAPI 3.1.0 at
    https://api.karumi.ai/api/v1/openapi.json (the shorter /openapi.json and /docs
    paths are behind a Cloudflare managed challenge), and the sitemap named a public
    MCP connector page. Karumi also runs a hosted OAuth-protected MCP server with 37
    published tools. Not published: security.txt, api-catalog, A2A agent card, status
    page, changelog, deprecation policy, rate limits, webhooks/AsyncAPI, and any
    client SDK in any package registry.
