apis:
- name: Karumi Public API
  description: Read-only REST API over Karumi session data — demo sessions and their
    full transcripts, per-session insights, session recordings, meeting events,
    aggregate and time-series analytics, and the targets (demo projects) with their
    user journeys. OpenAPI 3.1.0, JSON, limit/offset pagination, authenticated with
    an organization API key sent in the X-Api-Key header.
