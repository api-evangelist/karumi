- name: Karumi MCP Server
  description: Hosted, remote MCP server that exposes a Karumi workspace to any
    MCP-compatible client. 37 published tools cover organizations, agents, sessions,
    transcripts (keyword and semantic search), leads, companies, audiences, journeys,
    start pages, knowledge, voices, Q&A and API keys; 13 of them are write or
    destructive and require client confirmation. Authenticated with OAuth 2.0
    authorization code over HTTPS, advertising RFC 9728 protected-resource metadata.
  humanURL: https://www.karumi.ai/mcp-documentation
