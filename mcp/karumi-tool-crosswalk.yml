source: mcp/karumi-mcp.yml + openapi/karumi-public-api-openapi.json
note: >-
  Karumi's two agent-facing surfaces are non-overlapping in almost every direction. The
  MCP server is the operator surface (37 tools, OAuth, read AND write across the whole
  workspace); the Public API is a read-only reporting surface (9 GET operations, API key,
  sessions/insights/analytics/targets only). Because live tools/list is auth-gated (HTTP
  401), tools are bound to REST operations by name and published semantics, not by
  comparing inputSchema to parameters — every confidence value below reflects that.
surfaces:
  openapi:
    file: openapi/karumi-public-api-openapi.json
    base: https://api.karumi.ai/api/v1
    auth: X-Api-Key header
    gated: false
    note: The spec itself is publicly readable at https://api.karumi.ai/api/v1/openapi.json;
      the operations require a key.
  mcp:
    url: https://api.karumi.ai/mcp/
    auth: OAuth 2.0 authorization code
    gated: true
    note: 'tools/list returns 401; tool list taken from the provider''s published
      documentation at https://www.karumi.ai/mcp-documentation.'
  graphql:
    present: false
