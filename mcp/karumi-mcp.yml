defects:
- id: documented-mcp-host-does-not-resolve
  severity: high
  detail: >-
    https://mcp.karumi.ai, the connector URL published at
    https://www.karumi.ai/mcp-documentation, returns DNS NODATA (no A/AAAA record).
    A user following the documented setup cannot connect. The working endpoint is
    https://api.karumi.ai/mcp/.
  observed: '2026-08-13'
- id: stale-resource-documentation-link
  severity: low
  detail: >-
    The protected-resource document points resource_documentation at
    https://api.karumi.ai/docs, which is served behind a Cloudflare managed challenge
    (HTTP 403 to non-browser clients). The reachable API docs are at
    https://api.karumi.ai/api/v1/docs.
  observed: '2026-08-13'
