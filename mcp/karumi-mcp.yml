generated: '2026-08-13'
method: searched
status: published
source: https://www.karumi.ai/mcp-documentation
deployment:
  mode: remote
  endpoint: https://api.karumi.ai/mcp/
  auth: oauth
  verified: probed
  note: >-
    The provider's own MCP documentation page tells users to add
    https://mcp.karumi.ai as a custom connector. That hostname resolves to NODATA —
    it exists in the karumi.ai zone but publishes no A/AAAA record, so nothing can
    connect to it. The endpoint that actually answers MCP JSON-RPC is
    https://api.karumi.ai/mcp/, which Karumi names itself in the `resource` field of
    its RFC 9728 protected-resource document. Reported here as the reachable
    endpoint; the documented one is recorded as a live defect below.
server:
  name: karumi
  transport: http
  url: https://api.karumi.ai/mcp/
  documented_url: https://mcp.karumi.ai
  protocol: MCP over HTTPS (streamable HTTP; Accept application/json, text/event-stream)
  session_header: mcp-session-id
  cors:
    allow_origin: '*'
    allow_methods: [GET, POST, DELETE, OPTIONS]
    allow_headers: [authorization, content-type, x-api-key, mcp-session-id]
authentication:
  type: oauth2
  flow: authorization_code
  consent: explicit user consent screen at Karumi sign-in
  protected_resource_metadata: https://api.karumi.ai/.well-known/oauth-protected-resource
  authorization_server: https://qmfmxcidbawbvkcstvio.supabase.co/auth/v1
  challenge: 'WWW-Authenticate: Bearer resource_metadata="https://api.karumi.ai/.well-known/oauth-protected-resource"'
  revocation: Remove the connector in the MCP client, or revoke access in Karumi account
    settings — takes effect immediately.
  scoping: Access is limited to the organization(s) the authenticating user belongs to.
clients:
  - name: Claude
    path: Settings -> Connectors -> Karumi connector, or "Add custom connector"
introspection:
  tools_list: gated
  http_status: 401
  probed: '2026-08-13'
  note: >-
    POST {"jsonrpc":"2.0","id":1,"method":"tools/list"} to https://api.karumi.ai/mcp/
    returns HTTP 401 {"error": "unauthorized"}. The live inputSchema for each tool
    therefore requires an authenticated introspection pass. The tool list below is the
    provider's own published list (names + read/write classification) from
    https://www.karumi.ai/mcp-documentation — descriptions are summarised from that
    page's prose, and no input schema is asserted for any tool.
