  evidence: GET https://api.karumi.ai/api/v1/sessions with no key
  remediation: Send the organization API key in the X-Api-Key request header. Mint or
    rotate keys from the Karumi workspace or the create_api_key / revoke_api_key MCP
    tools.
  source_operation: all nine operations (enforced by the server, undeclared in the spec)
