method: derived
source: openapi/karumi-public-api-openapi.json
format: not-rfc9457
envelope:
  media_type: application/json
  field: detail
  shapes:
  - string (auth, not-found, and other HTTPException responses)
  - array of ValidationError objects (422 request validation)
  note: >-
    Karumi returns the FastAPI default error envelope. It does NOT use RFC 9457
    application/problem+json — there is no type, title, status or instance member, and
    no error-code registry. `detail` is polymorphic, which is the main hazard for an
    agent: a client that assumes a string will break on a 422 and a client that assumes
    an array will break on a 401.
problems:
- status: 422
  title: Validation Error
  schema: HTTPValidationError
  documented_in_spec: true
  detail_shape: array
  members:
  - loc — array of string/integer, the path to the offending input
  - msg — human-readable message
  - type — Pydantic error type identifier
  - input — the rejected value (optional)
  - ctx — extra context (optional)
  remediation: Correct the named query/path parameter. Common causes are a non-UUID
    project_id or session_id, a malformed RFC 3339 start_date/end_date, or a limit
    outside 1..500.
  source_operation: all nine operations declare this response
- status: 401
  title: Missing or invalid API key
