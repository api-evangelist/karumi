docs: https://api.karumi.ai/api/v1/docs
note: >-
  Karumi publishes no written API conventions guide. Everything below is derived from
  the harvested OpenAPI and from live responses observed on 2026-08-13, or read from the
  MCP documentation page. Absences are recorded as absences.
authentication:
  style: api-key
  header: X-Api-Key
  scope: organization
  declared_in_spec: false
  enforced: true
  evidence: 'GET https://api.karumi.ai/api/v1/sessions -> 401 {"detail":"Missing X-Api-Key
    header"}'
  see: authentication/karumi-authentication.yml
idempotency:
  supported: false
  note: >-
    Not applicable to the Public API as published — all nine operations are GET and
    therefore naturally idempotent, and there is no idempotency-key header, parameter or
    documented replay contract anywhere in the spec. The write surface lives on the MCP
    server, which has no published idempotency contract either. No Idempotency pointer
    is emitted for this provider.
pagination:
  style: offset-limit
  applies_to:
  - list_sessions_sessions_get
  - list_meeting_events_sessions_meeting_events_get
  request_params:
  - name: limit
    in: query
    default: 100
    minimum: 1
    maximum: 500
  - name: offset
    in: query
    default: 0
    minimum: 0
  response_envelope:
    schemas:
    - PaginatedSessions
    - PaginatedSessionEvents
    fields:
    - items
    - total
    - limit
    - offset
  cursor: false
  link_header: false
  note: total is returned, so a client can compute the page count; there is no next/prev
    link and no cursor.
filtering:
  list_sessions_sessions_get:
  - project_id (uuid)
  - status (string)
  - start_date (date-time)
  - end_date (date-time)
  list_meeting_events_sessions_meeting_events_get:
  - see spec
  note: Filtering is per-operation query parameters; there is no generic filter grammar.
field_expansion:
  supported: false
  note: >-
    No expand/fields/include parameters. Expansion is instead baked into distinct
    schemas — GET /sessions returns PublicSession, GET /sessions/{id} returns
    PublicSessionWithMessages (adds messages[] and recording_url), and
    GET /targets/{id} returns PublicTargetWithJourneys (adds journeys[]).
sparse_fieldsets:
  supported: false
metadata:
