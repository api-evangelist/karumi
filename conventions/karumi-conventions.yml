request_tracing:
  request_id_header: false
  note: >-
    No X-Request-Id or correlation header is documented or returned. Responses do carry
    Render's `rndr-id` and Cloudflare's `cf-ray`, which are infrastructure identifiers,
    not a provider-supported trace contract.
versioning:
  scheme: uri-path
  current: v1
  base: https://api.karumi.ai/api/v1
  spec_version: 1.0.0
  header_negotiation: false
