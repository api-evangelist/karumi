    body: '{"detail": "Missing X-Api-Key header"}'
  not_found:
    status: 404
    body: '{"detail": "Not Found"}'
  note: >-
    The FastAPI default envelope. `detail` is a string on some errors and an array of
    ValidationError objects on 422, so a client must type-check the field before reading
    it. Content-type is application/json, never application/problem+json.
  see: errors/karumi-problem-types.yml
