source: npm, PyPI, RubyGems, crates.io registry searches + https://app.karumi.ai/chat.js
note: >-
  Karumi publishes no client SDK in any package registry. The only first-party
  distributable is the browser Chat Bar widget, served unversioned from Karumi's own
  origin — a CDN-style distribution with no registry metadata endpoint to query. No
  `SDKs` pointer is emitted in apis.yml, because an embeddable chat widget is not a
  client library for the Public API and claiming otherwise would credit Karumi with an
  SDK it does not ship.
packages:
- language: javascript
  registry: cdn
  name: Karumi Chat Bar (chat.js)
  url: https://app.karumi.ai/chat.js
  install: '<script src="https://app.karumi.ai/chat.js" data-target-id="YOUR_TARGET_ID"></script>'
  official: true
  version: null
  published: null
  note: >-
    Unpinned distribution. The URL carries no version segment and no query version, and
    there is no jsDelivr/unpkg mirror or npm package behind it, so there is no metadata
    endpoint to read a version or release date from — a consumer embedding this script
    cannot tell which build they are getting either. Observed 2026-08-13: HTTP 200,
    application/javascript, 425,868 bytes.
  kind: embeddable-widget
  see: components/karumi-components.yml
