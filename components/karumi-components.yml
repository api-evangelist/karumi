  install: '<script src="https://app.karumi.ai/chat.js" data-target-id="YOUR_TARGET_ID"></script>'
  description: >-
    A chat bar pinned to the bottom-center of any page. A visitor types a question, the
    bar expands into a chat panel and the AI assistant's reply streams in. An optional
    action button (for example "Book a demo") sits next to the bar and always opens in a
    new tab. Hovering reveals a control that minimizes the chat into an "Ask <Title>"
    pill docked bottom-right.
  configuration:
    style: html data attributes
    defaults: fetched from the server per target-id when the attribute is omitted
    options:
    - name: data-target-id
      required: true
      description: Target ID for the chat.
    - name: data-placeholder
      description: Input placeholder. Default fetched from server, or "Ask anything...".
    - name: data-color
      description: Primary color. Default fetched from server, or "#ff6467".
    - name: data-action-label
      description: Action button label. Default fetched from server.
    - name: data-action-icon
      description: 'Action button icon preset: calendar, phone, arrow-right,
        external-link, message-circle, sparkles. Default calendar.'
    - name: data-action-url
      description: Action button URL; always opens in a new tab.
    - name: data-avatar-url
      description: Avatar image URL, replacing the default Karumi icon.
    - name: data-title
      description: Panel header title. Default fetched from server, falling back to
        the agent name, then "Assistant".
    - name: data-subtitle
      description: Smaller muted line under the panel header title. Hidden when empty.
    - name: data-layout
      description: 'On-page position: center (default) or right. Legacy presets
        bar-center/pill-center/pill-right are accepted and normalized.'
    - name: data-default-start
      description: 'Initial resting state: pill, collapsed (default) or expanded.'
    - name: data-footer-caption
      description: Small muted caption at the bottom of the expanded panel.
    - name: data-loading-style
      description: 'Waiting indicator: "dots" (default) or "text" (phrase-cycling
        shimmer line).'
    - name: data-language
      description: 'UI language for the widget''s fixed text: en (default), es, de, fr,
        it, nl, pt. Accepts a base or full BCP-47 code; unknown codes fall back to
        English. Operator copy (title, messages) is not translated by this.'
    - name: data-movable-launcher
      description: '"true" lets the minimized pill be dragged.'
