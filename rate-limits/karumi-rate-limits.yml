note: >-
  Karumi publishes no rate limits. There is no rate-limit or throttling section in the
  Swagger/ReDoc reference (the only API documentation that exists), no limits on the
  pricing page, and no RateLimit-*, X-RateLimit-* or Retry-After header on any response
  observed on 2026-08-13 — including the 401 from GET /api/v1/sessions and the 401 from
  POST /mcp/. An honest zero: limits may well be enforced server-side, but nothing is
  signalled to a client, so an agent has no runtime backoff signal to read.
