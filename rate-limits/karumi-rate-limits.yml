edge_protection:
  provider: Cloudflare
  note: >-
    api.karumi.ai serves a Cloudflare managed challenge (HTTP 403, cf-mitigated:
    challenge) on /, /docs, /redoc, /health and /openapi.json to non-browser clients,
    while /api/v1/* answers normally. That is bot mitigation rather than rate limiting,
    but it is the throttling behaviour a machine client will actually meet first.
  evidence:
